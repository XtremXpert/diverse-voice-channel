; DSH voice bridge: dial 1099 to talk to the local agent.
[ctx-diverse-internal-b2aad269-1f2e-4056-bcd2-ee2d8000b276]
exten => 1099,1,NoOp(DSH voice bridge)
 same => n,Answer()
 same => n,Set(DSH_CALL_UUID=${UUID()})
 same => n,AudioSocket(${DSH_CALL_UUID},192.168.235.231:8090)
 same => n,Hangup()

; Outbound leg used by channel originate: records the call for diagnostics.
[dsh-bridge]
exten => s,1,NoOp(DSH outbound bridge)
 same => n,Answer()
 same => n,MixMonitor(dsh-${UNIQUEID}.wav)
 same => n,Set(DSH_CALL_UUID=${UUID()})
 same => n,AudioSocket(${DSH_CALL_UUID},192.168.235.231:8090)
 same => n,Hangup()

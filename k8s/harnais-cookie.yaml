# Injecte le cookie de session du harnais sur chaque requête.
# La valeur est écrite par scripts/refresh-harnais-cookie.sh à chaque démarrage du serveur.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harnais-cookie
  namespace: lan
spec:
  headers:
    customRequestHeaders:
      Cookie: "dsh=initial"

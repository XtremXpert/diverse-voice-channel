# Accès HTTPS au harnais (Mac Studio, 192.168.235.231:3080) via le Traefik du cluster.
# Le service n'a pas de sélecteur : la cible est une adresse hors cluster.
apiVersion: v1
kind: Service
metadata:
  name: harnais-harness
  namespace: default
spec:
  ports:
    - name: http
      port: 3080
      targetPort: 3080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: harnais-harness
  namespace: default
subsets:
  - addresses:
      - ip: 192.168.235.231
    ports:
      - name: http
        port: 3080
---
# Restreint l'accès au réseau local (/20) ; retirer pour ouvrir plus largement.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harnais-lan-only
  namespace: default
spec:
  ipAllowList:
    sourceRange:
      - 192.168.224.0/20
---
# Identifiants fixes devant le harnais : indépendants du jeton éphémère du serveur web.
# users: htpasswd (bcrypt ou apr1), créé depuis le secret harnais-basicauth.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harnais-auth
  namespace: default
spec:
  basicAuth:
    secret: harnais-basicauth
---
---
# Limite le débit : 20 req/s en moyenne, rafale de 40, contre le bourrage d'identifiants.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: harnais-ratelimit
  namespace: lan
spec:
  rateLimit:
    average: 20
    burst: 40
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harnais
  annotations:
    kubernetes.io/ingress.class: traefik
  namespace: default
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`harnais.636.vezina.biz`)
      kind: Rule
      middlewares:
        - name: harnais-ratelimit
        - name: harnais-auth
      services:
        - name: harnais-harness
          port: 3080
  tls: {}
